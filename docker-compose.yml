services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started

  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
      MTX_RTSPTRANSPORTS: tcp
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PASS: ""
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_USER: ${MEDIAMTX_API_USER}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_API_PASSWORD}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  storage_data:
  caddy_data:
  caddy_config: